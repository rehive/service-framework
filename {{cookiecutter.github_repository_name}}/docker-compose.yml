services:
  postgres:
    image: postgres:18.0
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql
{% if cookiecutter.use_celery == "yes" %}
  rabbitmq:
    image: rabbitmq:3
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
{% endif %}
volumes:
  pgdata:
    driver: local
