# Default values for rehive-service.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
deployment:
  replicaCount: 3
  resources:
    requests:
      memory: 350M
      cpu: 10m
    limits:
      memory: 750M
      cpu: 350m
  command: [gunicorn, --bind, 0.0.0.0:8000, --workers, '4', --worker-class, config.workers.UvicornWorker, --pythonpath, src, config.asgi:application]
  args: null
image:
  repository: {{ cookiecutter.docker_image_production }}
  tag: latest
  pullPolicy: IfNotPresent
service:
  name: {{cookiecutter.app_name}}
  type: ClusterIP
  externalPort: 80
  internalPort: 8000
  readinessProbe:
    httpGet:
      path: /readiness
      port: 8000
    initialDelaySeconds: 10
    timeoutSeconds: 2
    periodSeconds: 10
ingress:
  enabled: false
postgres:
  enabled: true
  host: 172.26.144.2
  port: '5432'
  db: {{cookiecutter.module_name}}
  secret:
    key: postgres-password
    name: postgres
  user: {{cookiecutter.module_name}}
{% if cookiecutter.use_celery == "yes" -%}
rabbitmq:
  enabled: true
  host: mini-yellow-goose.in.rmq2.cloudamqp.com
  user: scztisej
  vhost: scztisej
  port: 5672
  secret:
    name: rabbitmq
    key: rabbitmq-password
{%- else -%}
rabbitmq:
  enabled: false
{%- endif %}
redis:
  enabled: false
{% if cookiecutter.use_celery == "yes" -%}
workers:
  enabled: true
  deployments:
  - name: worker-general
    internalPort: 8000
    replicaCount: 1
    command: [celery, -A, config.celery, worker, --loglevel=INFO, --concurrency=1,
      --without-gossip, --without-mingle, --without-heartbeat, -Q, general-{{cookiecutter.app_name}}]
    resources:
      requests:
        cpu: 50m
        memory: 100Mi
      limits:
        cpu: 500m
        memory: 500Mi
  - name: worker-platform-webhooks
    internalPort: 8000
    replicaCount: 1
    command: [celery, -A, config.celery, worker, --loglevel=INFO, --concurrency=1,
      --without-gossip, --without-mingle, --without-heartbeat, -Q, platform-webhook-{{cookiecutter.app_name}}]
    resources:
      requests:
        cpu: 50m
        memory: 100Mi
      limits:
        cpu: 500m
        memory: 500Mi
  - name: scheduler
    internalPort: 8000
    replicaCount: 1
    command: [celery, -A, config.celery, worker, --beat, --loglevel=INFO, --concurrency=1,
      --without-gossip, --without-mingle, --without-heartbeat, -Q, dummy-queue-{{cookiecutter.app_name}}]
    resources:
      requests:
        cpu: 50m
        memory: 100Mi
      limits:
        cpu: 500m
        memory: 500Mi
{%- else -%}
workers:
  enabled: false
{%- endif %}
