deployment:
  replicaCount: 1
  command: [gunicorn, config.wsgi:application, --config, file:config/gunicorn.py]
  args: null
image:
  pullPolicy: IfNotPresent
  repository: {{ cookiecutter.docker_image_staging }}
  tag: latest
ingress:
  enabled: false
postgres:
  enabled: true
  host: 172.30.224.3
  port: 5432
  db: {{cookiecutter.module_name}}
  secret:
    key: postgres-password
    name: postgres
  user: {{cookiecutter.module_name}}
{% if cookiecutter.use_celery == "yes" -%}
rabbitmq:
  enabled: true
  host: advanced-azure-ladybird.in.rmq2.cloudamqp.com
  user: sxclzvgq
  vhost: sxclzvgq
  port: 5672
  secret:
    name: rabbitmq
    key: rabbitmq-password
{%- else -%}
rabbitmq:
  enabled: false
{%- endif %}
redis:
  enabled: false
service:
  externalPort: 80
  internalPort: 8000
  name: {{cookiecutter.app_name}}
  readinessProbe:
    httpGet:
      path: /readiness
      port: 8000
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 2
  type: ClusterIP
{% if cookiecutter.use_celery == "yes" -%}
workers:
  enabled: true
  deployments:
  - name: worker-general
    internalPort: 8000
    replicaCount: 1
    command: [celery, -A, config.celery, worker, --loglevel=INFO, --concurrency=1,
      --without-gossip, --without-mingle, --without-heartbeat, -Q, general-{{cookiecutter.app_name}}-staging]
    resources:
      requests:
        cpu: 50m
        memory: 100Mi
      limits:
        cpu: 500m
        memory: 500Mi
  - name: worker-platform-webhooks
    internalPort: 8000
    replicaCount: 1
    command: [celery, -A, config.celery, worker, --loglevel=INFO, --concurrency=1,
      --without-gossip, --without-mingle, --without-heartbeat, -Q, platform-webhook-{{cookiecutter.app_name}}-staging]
    resources:
      requests:
        cpu: 50m
        memory: 100Mi
      limits:
        cpu: 500m
        memory: 500Mi
  - name: scheduler
    internalPort: 8000
    replicaCount: 1
    # celery beat: never run two schedulers during a rollout.
    strategy:
      type: Recreate
    command: [celery, -A, config.celery, worker, --beat, --loglevel=INFO, --concurrency=1,
      --without-gossip, --without-mingle, --without-heartbeat, -Q, dummy-queue-{{cookiecutter.app_name}}-staging]
    resources:
      requests:
        cpu: 50m
        memory: 100Mi
      limits:
        cpu: 500m
        memory: 500Mi
{%- else -%}
workers:
  enabled: false
{%- endif %}
